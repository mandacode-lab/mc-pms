basePath: /api/client/v1
definitions:
  internal_adapter_http_handler_client_ns.GetByIDResponse:
    properties:
      namespace:
        $ref: '#/definitions/internal_adapter_http_handler_client_ns.NamespaceResponse'
    type: object
  internal_adapter_http_handler_client_ns.NamespaceResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      name:
        type: string
      namespace_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_adapter_http_handler_client_project.GetByIDResponse:
    properties:
      project:
        $ref: '#/definitions/internal_adapter_http_handler_client_project.ProjectResponse'
    type: object
  internal_adapter_http_handler_client_project.IsValidProjectNamespaceResponse:
    properties:
      valid:
        type: boolean
    type: object
  internal_adapter_http_handler_client_project.ProjectResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      name:
        type: string
      namespace_id:
        type: string
      project_id:
        type: string
      updated_at:
        type: string
    type: object
  merr.ErrCode:
    enum:
    - unknown
    - not_found
    - invalid_input
    - permission_denied
    - internal_server_error
    - timeout
    - conflict
    - unauthorized
    - bad_request
    - service_unavailable
    - too_many_requests
    - gateway_timeout
    - unprocessable_entity
    - not_implemented
    - method_not_allowed
    - forbidden
    - precondition_failed
    - expectation_failed
    - bad_gateway
    - length_required
    - unsupported_media_type
    - range_not_satisfiable
    - insufficient_storage
    - loop_detected
    - not_acceptable
    - too_early
    - request_header_fields_too_large
    type: string
    x-enum-varnames:
    - ErrUnknown
    - ErrNotFound
    - ErrInvalidInput
    - ErrPermissionDenied
    - ErrInternalServerError
    - ErrTimeout
    - ErrConflict
    - ErrUnauthorized
    - ErrBadRequest
    - ErrServiceUnavailable
    - ErrTooManyRequests
    - ErrGatewayTimeout
    - ErrUnprocessableEntity
    - ErrNotImplemented
    - ErrMethodNotAllowed
    - ErrForbidden
    - ErrPreconditionFailed
    - ErrExpectationFailed
    - ErrBadGateway
    - ErrLengthRequired
    - ErrUnsupportedMediaType
    - ErrRangeNotSatisfiable
    - ErrInsufficientStorage
    - ErrLoopDetected
    - ErrNotAcceptable
    - ErrTooEarly
    - ErrRequestHeaderFieldsTooLarge
