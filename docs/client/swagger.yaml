    properties:
      code:
        $ref: '#/definitions/merr.ErrCode'
      error:
        type: string
    type: object
host: pms.mandacode.com
info:
  contact:
    email: support@mandacode.com
    name: API Support
    url: https://mandacode.com/support
  description: Client API for MandaCode Project Management System - read-only access
    to namespaces and projects
  termsOfService: https://mandacode.com/terms
  title: MandaCode PMS Client API
  version: "1.0"
paths:
  /namespaces/{id}:
    get:
      consumes:
      - application/json
      description: Get a namespace by its ID (read-only)
      parameters:
      - description: Namespace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Namespace found
          schema:
            $ref: '#/definitions/internal_adapter_http_handler_client_ns.GetByIDResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "404":
          description: Namespace not found
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      summary: Get namespace by ID
      tags:
      - client
  /projects/{id}:
    get:
      consumes:
      - application/json
      description: Get a project by its ID (read-only)
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project found
          schema:
            $ref: '#/definitions/internal_adapter_http_handler_client_project.GetByIDResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      summary: Get project by ID
      tags:
      - client
  /projects/validate:
    get:
      consumes:
      - application/json
      description: Check if a project belongs to a specific namespace
      parameters:
      - description: Project ID
        in: query
        name: project_id
        required: true
        type: string
      - description: Namespace ID
        in: query
        name: namespace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Validation result
          schema:
            $ref: '#/definitions/internal_adapter_http_handler_client_project.IsValidProjectNamespaceResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      summary: Validate project-namespace relationship
      tags:
      - client
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Client read-only operations for namespace and project access
  name: client
