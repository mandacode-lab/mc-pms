info:
  contact:
    name: API Support
  description: Basic Authentication using ClientAppID as username and ClientSecret
    as password
  title: MandaCode Service Hub Client API
  version: "1.0"
paths:
  /client-access/verify:
    post:
      consumes:
      - application/json
      description: Verify client application credentials using Basic Authentication
        (client_id:client_secret)
      produces:
      - application/json
      responses:
        "200":
          description: Client verification successful - returns service_id
          schema:
            $ref: '#/definitions/internal_adapter_handler_client_access.VerifyClientResponse'
        "400":
          description: Bad request - Invalid client_id format
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "401":
          description: Unauthorized - Invalid client_secret
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "403":
          description: Forbidden - Client or service inactive
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "404":
          description: Not found - Client or service not found
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Verify client credentials
      tags:
      - client-access
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
