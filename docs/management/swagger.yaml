basePath: /v1
definitions:
  internal_adapter_handler_client_access.ClientAppResponse:
    properties:
      client_app_id:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
    type: object
  internal_adapter_handler_client_access.ServiceInfoResponse:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      service_id:
        type: string
    type: object
  internal_adapter_handler_client_access.VerifyClientResponse:
    properties:
      client_app:
        $ref: '#/definitions/internal_adapter_handler_client_access.ClientAppResponse'
      is_valid:
        type: boolean
      service_id:
        type: string
      service_info:
        $ref: '#/definitions/internal_adapter_handler_client_access.ServiceInfoResponse'
    type: object
  internal_adapter_handler_clientapp_mgmt.ClientAppResponse:
    properties:
      client_app_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      service_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_adapter_handler_clientapp_mgmt.CreateClientAppRequest:
    properties:
      description:
        example: Description of my application
        type: string
      name:
        example: My App
        type: string
      service_id:
        example: srv_1234567890abcdef
        type: string
    required:
    - name
    - service_id
    type: object
  internal_adapter_handler_clientapp_mgmt.CreateClientAppResponse:
    properties:
      client_app_id:
        example: app_abcdef1234567890
        type: string
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      description:
        example: Description of my application
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: My App
        type: string
      secret:
        example: secret_xyz789abc123def456
        type: string
      service_id:
        example: srv_1234567890abcdef
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  internal_adapter_handler_clientapp_mgmt.ListClientAppsResponse:
    properties:
      client_apps:
        items:
          $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.ClientAppResponse'
        type: array
      service_id:
        type: string
    type: object
  internal_adapter_handler_clientapp_mgmt.RefreshSecretResponse:
    properties:
      secret:
        type: string
    type: object
  internal_adapter_handler_clientapp_mgmt.UpdateClientAppRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  internal_adapter_handler_clientapp_mgmt.UpdateClientAppResponse:
    properties:
      client_app_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      service_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_adapter_handler_service_mgmt.CreateServiceRequest:
    properties:
      description:
        example: Service description
        type: string
      name:
        example: My Service
        type: string
    required:
    - name
    type: object
  internal_adapter_handler_service_mgmt.CreateServiceResponse:
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      description:
        example: Service description
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: My Service
        type: string
      service_id:
        example: srv_1234567890abcdef
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  internal_adapter_handler_service_mgmt.UpdateServiceRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  internal_adapter_handler_service_mgmt.UpdateServiceResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      service_id:
        type: string
      updated_at:
        type: string
    type: object
  merr.ErrCode:
    enum:
    - unknown
    - not_found
    - invalid_input
    - permission_denied
    - internal_server_error
    - timeout
    - conflict
    - unauthorized
    - bad_request
    - service_unavailable
    - too_many_requests
    - gateway_timeout
    - unprocessable_entity
    - not_implemented
    - method_not_allowed
    - forbidden
    - precondition_failed
    - expectation_failed
    - bad_gateway
    - length_required
    - unsupported_media_type
    - range_not_satisfiable
    - insufficient_storage
    - loop_detected
    - not_acceptable
    - too_early
    - request_header_fields_too_large
    type: string
    x-enum-varnames:
    - ErrUnknown
    - ErrNotFound
    - ErrInvalidInput
    - ErrPermissionDenied
    - ErrInternalServerError
    - ErrTimeout
    - ErrConflict
    - ErrUnauthorized
    - ErrBadRequest
    - ErrServiceUnavailable
    - ErrTooManyRequests
    - ErrGatewayTimeout
    - ErrUnprocessableEntity
    - ErrNotImplemented
    - ErrMethodNotAllowed
    - ErrForbidden
    - ErrPreconditionFailed
    - ErrExpectationFailed
    - ErrBadGateway
    - ErrLengthRequired
    - ErrUnsupportedMediaType
    - ErrRangeNotSatisfiable
    - ErrInsufficientStorage
    - ErrLoopDetected
    - ErrNotAcceptable
    - ErrTooEarly
    - ErrRequestHeaderFieldsTooLarge
  merrmid.ErrorResponse:
    properties:
      code:
        $ref: '#/definitions/merr.ErrCode'
      error:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Basic Authentication using ClientAppID as username and ClientSecret
    as password
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: MandaCode Service Hub Core API
  version: "1.0"
paths:
  /client-access/verify:
    post:
      consumes:
      - application/json
      description: Verify client application credentials using Basic Authentication
        (client_id:client_secret)
      produces:
      - application/json
      responses:
        "200":
          description: Client verification result
          schema:
            $ref: '#/definitions/internal_adapter_handler_client_access.VerifyClientResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "401":
          description: Unauthorized - Invalid credentials
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      security:
      - BasicAuth: []
      summary: Verify client credentials
      tags:
      - client-access
  /client-apps:
    get:
      description: List all OAuth client applications for a specific service
      parameters:
      - description: Service ID
        in: query
        name: service_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of client apps
          schema:
            $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.ListClientAppsResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      summary: List client apps
      tags:
      - client-apps
    post:
      consumes:
      - application/json
      description: Create a new OAuth client application
      parameters:
      - description: Client app creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.CreateClientAppRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created client app with secret
          schema:
            $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.CreateClientAppResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      summary: Create a new client app
      tags:
      - client-apps
  /client-apps/{id}:
    put:
      consumes:
      - application/json
      description: Update an existing OAuth client application
      parameters:
      - description: Client App ID
        in: path
        name: id
        required: true
        type: string
      - description: Client app update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.UpdateClientAppRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated client app
          schema:
            $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.UpdateClientAppResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      summary: Update a client app
      tags:
      - client-apps
  /client-apps/{id}/refresh-secret:
    post:
      description: Generate a new secret for an OAuth client application
      parameters:
      - description: Client App ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: New secret
          schema:
            $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.RefreshSecretResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      summary: Refresh client app secret
      tags:
      - client-apps
  /services:
    post:
      consumes:
      - application/json
      description: Create a new multi-tenant service
      parameters:
      - description: Service creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler_service_mgmt.CreateServiceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created service
          schema:
            $ref: '#/definitions/internal_adapter_handler_service_mgmt.CreateServiceResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "404":
          description: Resource not found
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      summary: Create a new service
      tags:
      - services
  /services/{id}:
    put:
      consumes:
      - application/json
      description: Update an existing multi-tenant service
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      - description: Service update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler_service_mgmt.UpdateServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated service
          schema:
            $ref: '#/definitions/internal_adapter_handler_service_mgmt.UpdateServiceResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "404":
          description: Resource not found
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/merrmid.ErrorResponse'
      summary: Update a service
      tags:
      - services
securityDefinitions:
  BasicAuth:
    type: basic
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
