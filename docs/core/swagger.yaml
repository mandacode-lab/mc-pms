basePath: /v1
definitions:
  common.ErrorResponse:
    properties:
      code:
        $ref: '#/definitions/merr.ErrCode'
      error:
        type: string
    type: object
  identify_user.GetAuthURLResponse:
    properties:
      auth_url:
        type: string
      state:
        type: string
    type: object
  identify_user.IdentifyByCodeResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      nickname:
        type: string
      provider:
        type: string
      raw_data:
        additionalProperties: {}
        type: object
      service_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  identify_user.IdentifyByTokenResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      nickname:
        type: string
      provider:
        type: string
      raw_data:
        additionalProperties: {}
        type: object
      service_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  internal_adapter_handler_clientapp_mgmt.ClientAppResponse:
    properties:
      client_app_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      service_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_adapter_handler_clientapp_mgmt.CreateClientAppRequest:
    properties:
      description:
        type: string
      name:
        type: string
      service_id:
        type: string
    required:
    - name
    - service_id
    type: object
  internal_adapter_handler_clientapp_mgmt.CreateClientAppResponse:
    properties:
      client_app_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      secret:
        type: string
      service_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_adapter_handler_clientapp_mgmt.ListClientAppsResponse:
    properties:
      client_apps:
        items:
          $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.ClientAppResponse'
        type: array
      service_id:
        type: string
    type: object
  internal_adapter_handler_clientapp_mgmt.RefreshSecretResponse:
    properties:
      secret:
        type: string
    type: object
  internal_adapter_handler_clientapp_mgmt.UpdateClientAppRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  internal_adapter_handler_clientapp_mgmt.UpdateClientAppResponse:
    properties:
      client_app_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      service_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_adapter_handler_service_mgmt.CreateServiceRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  internal_adapter_handler_service_mgmt.CreateServiceResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      service_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_adapter_handler_service_mgmt.UpdateServiceRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  internal_adapter_handler_service_mgmt.UpdateServiceResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      service_id:
        type: string
      updated_at:
        type: string
    type: object
  internal_adapter_handler_user_mgmt.FindUserInfoResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/internal_adapter_handler_user_mgmt.UserResponse'
        type: array
    type: object
  internal_adapter_handler_user_mgmt.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      nickname:
        type: string
      provider:
        type: string
      service_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  internal_adapter_handler_weboauth_mgmt.ReadWebOAuthResponse:
    properties:
      web_oauths:
        items:
          $ref: '#/definitions/internal_adapter_handler_weboauth_mgmt.WebOAuthResponse'
        type: array
    type: object
  internal_adapter_handler_weboauth_mgmt.RegisterWebOAuthRequest:
    properties:
      client_app_id:
        type: string
      oauth_client_id:
        type: string
      oauth_secret:
        type: string
      provider:
        type: string
      redirect_uri:
        type: string
      scopes:
        items:
          type: string
        type: array
    required:
    - client_app_id
    - oauth_client_id
    - oauth_secret
    - provider
    - redirect_uri
    - scopes
    type: object
  internal_adapter_handler_weboauth_mgmt.RegisterWebOAuthResponse:
    properties:
      message:
        type: string
    type: object
  internal_adapter_handler_weboauth_mgmt.WebOAuthResponse:
    properties:
      client_app_id:
        type: string
      created_at:
        type: string
      oauth_client_id:
        type: string
      provider:
        type: string
      redirect_uri:
        type: string
      scopes:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  merr.ErrCode:
    enum:
    - unknown
    - not_found
    - invalid_input
    - permission_denied
    - internal_server_error
    - timeout
    - conflict
    - unauthorized
    - bad_request
    - service_unavailable
    - too_many_requests
    - gateway_timeout
    - unprocessable_entity
    - not_implemented
    - method_not_allowed
    - forbidden
    - precondition_failed
    - expectation_failed
    - bad_gateway
    - length_required
    - unsupported_media_type
    - range_not_satisfiable
    - insufficient_storage
    - loop_detected
    - not_acceptable
    - too_early
    - request_header_fields_too_large
    type: string
    x-enum-varnames:
    - ErrUnknown
    - ErrNotFound
    - ErrInvalidInput
    - ErrPermissionDenied
    - ErrInternalServerError
    - ErrTimeout
    - ErrConflict
    - ErrUnauthorized
    - ErrBadRequest
    - ErrServiceUnavailable
    - ErrTooManyRequests
    - ErrGatewayTimeout
    - ErrUnprocessableEntity
    - ErrNotImplemented
    - ErrMethodNotAllowed
    - ErrForbidden
    - ErrPreconditionFailed
    - ErrExpectationFailed
    - ErrBadGateway
    - ErrLengthRequired
    - ErrUnsupportedMediaType
    - ErrRangeNotSatisfiable
    - ErrInsufficientStorage
    - ErrLoopDetected
    - ErrNotAcceptable
    - ErrTooEarly
    - ErrRequestHeaderFieldsTooLarge
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Multi-tenant service management and client application API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Serengeti Core API
  version: "1.0"
paths:
  /auth/auth-url:
    get:
      description: Generate OAuth authorization URL for specified provider and client
        app
      parameters:
      - description: OAuth Provider
        enum:
        - google
        - kakao
        - naver
        in: query
        name: provider
        required: true
        type: string
      - description: Client Application ID
        in: query
        name: client_app_id
        required: true
        type: string
      - description: Client Application Secret
        in: query
        name: client_app_secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Authorization URL and state
          schema:
            $ref: '#/definitions/identify_user.GetAuthURLResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Resource not found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get OAuth authorization URL
      tags:
      - auth
  /auth/identify-by-code:
    get:
      description: Identify user using OAuth authorization code flow
      parameters:
      - description: OAuth Provider
        enum:
        - google
        - kakao
        - naver
        in: query
        name: provider
        required: true
        type: string
      - description: OAuth authorization code
        in: query
        name: oauth_code
        required: true
        type: string
      - description: OAuth state parameter
        in: query
        name: state
        required: true
        type: string
      - description: Client Application ID
        in: query
        name: client_app_id
        required: true
        type: string
      - description: Client Application Secret
        in: query
        name: client_app_secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User identity information
          schema:
            $ref: '#/definitions/identify_user.IdentifyByCodeResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Identify user by code
      tags:
      - auth
  /auth/identify-by-token:
    get:
      description: Identify user using OAuth access token
      parameters:
      - description: OAuth Provider
        enum:
        - google
        - kakao
        - naver
        in: query
        name: provider
        required: true
        type: string
      - description: OAuth access token
        in: query
        name: token
        required: true
        type: string
      - description: Client Application ID
        in: query
        name: client_app_id
        required: true
        type: string
      - description: Client Application Secret
        in: query
        name: client_app_secret
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User identity information
          schema:
            $ref: '#/definitions/identify_user.IdentifyByTokenResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Identify user by token
      tags:
      - auth
  /client-apps:
    get:
      description: List all OAuth client applications for a specific service
      parameters:
      - description: Service ID
        in: query
        name: service_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of client apps
          schema:
            $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.ListClientAppsResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: List client apps
      tags:
      - client-apps
    post:
      consumes:
      - application/json
      description: Create a new OAuth client application
      parameters:
      - description: Client app creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.CreateClientAppRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created client app with secret
          schema:
            $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.CreateClientAppResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Create a new client app
      tags:
      - client-apps
  /client-apps/{id}:
    put:
      consumes:
      - application/json
      description: Update an existing OAuth client application
      parameters:
      - description: Client App ID
        in: path
        name: id
        required: true
        type: string
      - description: Client app update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.UpdateClientAppRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated client app
          schema:
            $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.UpdateClientAppResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Update a client app
      tags:
      - client-apps
  /client-apps/{id}/refresh-secret:
    post:
      description: Generate a new secret for an OAuth client application
      parameters:
      - description: Client App ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: New secret
          schema:
            $ref: '#/definitions/internal_adapter_handler_clientapp_mgmt.RefreshSecretResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Refresh client app secret
      tags:
      - client-apps
  /services:
    post:
      consumes:
      - application/json
      description: Create a new multi-tenant service
      parameters:
      - description: Service creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler_service_mgmt.CreateServiceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created service
          schema:
            $ref: '#/definitions/internal_adapter_handler_service_mgmt.CreateServiceResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Resource not found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Create a new service
      tags:
      - services
  /services/{id}:
    put:
      consumes:
      - application/json
      description: Update an existing multi-tenant service
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      - description: Service update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler_service_mgmt.UpdateServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated service
          schema:
            $ref: '#/definitions/internal_adapter_handler_service_mgmt.UpdateServiceResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Resource not found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Update a service
      tags:
      - services
  /users:
    get:
      description: Find user information based on various filter criteria
      parameters:
      - description: Service ID
        in: query
        name: service_id
        type: string
      - description: User ID
        in: query
        name: user_id
        type: string
      - description: OAuth Provider
        enum:
        - google
        - kakao
        - naver
        in: query
        name: provider
        type: string
      - description: User email
        in: query
        name: email
        type: string
      - description: User nickname
        in: query
        name: nickname
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of matching users
          schema:
            $ref: '#/definitions/internal_adapter_handler_user_mgmt.FindUserInfoResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Find users
      tags:
      - users
  /weboauth:
    get:
      description: Read OAuth configurations for a client application
      parameters:
      - description: Client App ID
        in: query
        name: client_app_id
        required: true
        type: string
      - description: OAuth Provider
        enum:
        - google
        - kakao
        - naver
        in: query
        name: provider
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OAuth configurations
          schema:
            $ref: '#/definitions/internal_adapter_handler_weboauth_mgmt.ReadWebOAuthResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Read OAuth configs
      tags:
      - weboauth
  /weboauth/register:
    post:
      consumes:
      - application/json
      description: Register OAuth configuration for a client application
      parameters:
      - description: OAuth registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapter_handler_weboauth_mgmt.RegisterWebOAuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: OAuth registered successfully
          schema:
            $ref: '#/definitions/internal_adapter_handler_weboauth_mgmt.RegisterWebOAuthResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Register OAuth config
      tags:
      - weboauth
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
