{{- if .Values.initialize.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "defined.fullname" . }}-initialize
  labels:
    {{- include "defined.initialize.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.initialize.backoffLimit }}
  template:
    metadata:
      annotations:
        checksum/db-secret: {{ include (print $.Template.BasePath "/shared/db-secret.yaml") . | sha256sum }}
        checksum/redis-secret: {{ include (print $.Template.BasePath "/shared/redis-secret.yaml") . | sha256sum }}
        checksum/kek-secret: {{ include (print $.Template.BasePath "/shared/kek-secret.yaml") . | sha256sum }}
      labels:
        {{- include "defined.initialize.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "defined.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: {{ .Values.initialize.restartPolicy }}
      containers:
        - name: initialize
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.initialize.imageName }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "defined.databaseSecretName" . }}
            - secretRef:
                name: {{ include "defined.redisSecretName" . }}
            - secretRef:
                name: {{ include "defined.kekSecretName" . }}
          resources:
            {{- toYaml .Values.initialize.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}