{{- if .Values.management.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "defined.management.configMapName" . }}
  labels:
    {{- include "defined.management.labels" . | nindent 4 }}
data:
  ENV: {{ .Values.management.env | default "prod" | quote }}
  PORT: "8080"
  READ_TIMEOUT: {{ .Values.management.server.readTimeout | quote }}
  WRITE_TIMEOUT: {{ .Values.management.server.writeTimeout | quote }}
  IAM_ENABLED: {{ .Values.management.iam.enabled | default true | quote }}
  IAM_SERVICE_URL: {{ .Values.management.iam.serviceUrl | default "http://localhost:8080" | quote }}
  SYSTEM_SERVICE_NAME: {{ .Values.management.systemClient.serviceName | default "system" | quote }}
  SYSTEM_CLIENT_NAME: {{ .Values.management.systemClient.clientName | default "system-client" | quote }}
{{- end }}
