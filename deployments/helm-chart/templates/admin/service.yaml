apiVersion: v1
kind: Service
metadata:
  name: {{ include "mc-pms.fullname" . }}-admin
  labels:
    {{- include "mc-pms.componentLabels" (dict "root" . "component" "admin") | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  ports:
  - port: {{ .Values.admin.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "mc-pms.componentSelectorLabels" (dict "root" . "component" "admin") | nindent 4 }}
