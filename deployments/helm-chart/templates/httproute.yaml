{{- if .Values.httpRoute.admin.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mc-pms.fullname" . }}-admin
  labels:
    {{- include "mc-pms.componentLabels" (dict "root" . "component" "admin") | nindent 4 }}
  {{- with .Values.httpRoute.admin.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httpRoute.admin.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.admin.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.httpRoute.admin.pathPrefix | default "/" }}
    backendRefs:
    - name: {{ include "mc-pms.fullname" . }}-admin
      port: {{ .Values.admin.service.port }}
{{- end }}
