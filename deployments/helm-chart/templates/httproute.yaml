{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mc-helm-lib.fullname" . }}
  labels:
    {{- include "mc-helm-lib.labels" (dict "root" $) | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- if .Values.admin.enabled }}
  - matches:
    - path:
        type: PathPrefix
        value: /api/admin
    backendRefs:
    - name: {{ include "mc-helm-lib.fullname" . }}-admin
      port: {{ .Values.admin.service.port }}
  {{- end }}
  {{- if .Values.client.enabled }}
  - matches:
    - path:
        type: PathPrefix
        value: /api/client
    backendRefs:
    - name: {{ include "mc-helm-lib.fullname" . }}-client
      port: {{ .Values.client.service.port }}
  {{- end }}
{{- end }}
