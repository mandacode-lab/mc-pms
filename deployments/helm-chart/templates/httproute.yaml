  {{- with .Values.httpRoute.client.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httpRoute.client.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.client.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.httpRoute.client.pathPrefix | default "/" }}
    backendRefs:
    - name: {{ include "mc-pms.fullname" . }}-client
      port: {{ .Values.client.service.port }}
{{- end }}
