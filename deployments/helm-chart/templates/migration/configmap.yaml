{{- if .Values.migration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mc-pms.fullname" . }}-migration
  labels:
    {{- include "mc-pms.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  # Database connection parameters (non-sensitive)
  HOST: {{ .Values.database.host | quote }}
  PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  SSL_MODE: {{ .Values.database.sslMode | quote }}

  # Migration options
  {{- if .Values.migration.allowDirty }}
  ALLOW_DIRTY: "true"
  {{- end }}
  {{- if .Values.migration.dryRun }}
  DRY_RUN: "true"
  {{- end }}
{{- end }}
