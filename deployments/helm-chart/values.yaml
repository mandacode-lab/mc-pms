# Chart name and version
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Service Account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Admin
admin:
  image: 
    repository: registry.mandacode.com/mandacode-pms/admin
    pullPolicy: IfNotPresent
    tag: ""

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /ready
      port: http

  # Resource requests and limits
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

  http:
    host: ""
    port: 8080
    readTimeout: 60s
    writeTimeout: 60s
    idleTimeout: 120s
    shutdownTimeout: 20s
    cors:
      enabled: false
      allowedOrigins: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  # Additional environment variables
  env: []

  # Volume mounts and volumes
  volumeMounts: []
  volumes: []

  # Node selection and scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Client
client:
  image: 
    repository: registry.mandacode.com/mandacode-pms/client
    pullPolicy: IfNotPresent
    tag: ""

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /ready
      port: http

  # Resource requests and limits
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

  http:
    host: ""
    port: 8080
    readTimeout: 60s
    writeTimeout: 60s
    idleTimeout: 120s
    shutdownTimeout: 20s
    cors:
      enabled: false
      allowedOrigins: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  # Additional environment variables
  env: []

  # Volume mounts and volumes
  volumeMounts: []
  volumes: []

  # Node selection and scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Migration
migration:
  image: 
    repository: registry.mandacode.com/mandacode-pms/migration
    pullPolicy: IfNotPresent
    tag: ""

  enabled: true
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400

  # Migration options
  allowDirty: false
  dryRun: false

  # Additional environment variables
  env: []

  # Resource requests and limits for migration job
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 256Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Pod configuration
  podAnnotations: {}

  # Node selection and scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Database
database:
  host: "db-host"
  port: 5432
  name: dbname
  username: dbuser
  password: "dbpassword"
  sslMode: "require"
  # existingSecret: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Expose the service via gateway-api HTTPRoute
httpRoute:
  # admin httpRoute
  admin:
    enabled: false
    annotations: {}
    parentRefs: 
    - name: gateway
      sectionName: http
    hostnames: []
    # - admin.example.com
    # Path prefix for routing (default: "/")
    pathPrefix: "/"
  
  # client httpRoute
  client:
    enabled: false
    annotations: {}
    parentRefs:
    - name: gateway
      sectionName: http
    hostnames: []
    # - client.example.com
    # Path prefix for routing (default: "/")
    pathPrefix: "/"

# Envoy Gateway Security Policy Configuration
# Requires Envoy Gateway to be installed
# Ref: https://gateway.envoyproxy.io/latest/api/extension_types/#securitypolicy
securityPolicy:
  # admin securityPolicy
  admin:
    enabled: false
    annotations: {}
    # JWT authentication configuration
    jwt:
      providers: []
      # Example:
      # - name: example
      #   issuer: https://example.com
      #   audiences:
      #   - example-audience
      #   remoteJWKS:
      #     uri: https://example.com/.well-known/jwks.json
    # OIDC authentication configuration
    oidc: {}
      # Example:
      # provider:
      #   issuer: https://example.com
      #   authorizationEndpoint: https://example.com/oauth2/authorize
      #   tokenEndpoint: https://example.com/oauth2/token
      # clientID: client-id
      # clientSecret:
      #   name: oidc-client-secret
      #   key: client-secret
      # redirectURL: https://admin.example.com/oauth2/callback
      # scopes:
      # - openid
      # - profile
      # - email
  
  # client securityPolicy
  client:
    enabled: false
    annotations: {}
    # JWT authentication configuration
    jwt:
      providers: []
      # Example:
      # - name: example
      #   issuer: https://example.com
      #   audiences:
      #   - example-audience
      #   remoteJWKS:
      #     uri: https://example.com/.well-known/jwks.json
    # OIDC authentication configuration
    oidc: {}
      # Example:
      # provider:
      #   issuer: https://example.com
      #   authorizationEndpoint: https://example.com/oauth2/authorize
      #   tokenEndpoint: https://example.com/oauth2/token
      # clientID: client-id
      # clientSecret:
      #   name: oidc-client-secret
      #   key: client-secret
      # redirectURL: https://client.example.com/oauth2/callback
      # scopes:
      # - openid
      # - profile
      # - email
