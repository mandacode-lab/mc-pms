# Chart name and version
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Service Account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Admin
admin:
  image: 
    repository: registry.mandacode.com/mandacode-pms/admin
    pullPolicy: IfNotPresent
    tag: ""

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /ready
      port: http

  # Resource requests and limits
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

  http:
    host: ""
    port: 8080
    readTimeout: 60s
    writeTimeout: 60s
    idleTimeout: 120s
    shutdownTimeout: 20s
    cors:
      enabled: false
      allowedOrigins: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  # Additional environment variables
  env: []

  # Volume mounts and volumes
  volumeMounts: []
  volumes: []

  # Node selection and scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Client
client:
  image: 
    repository: registry.mandacode.com/mandacode-pms/client
    pullPolicy: IfNotPresent
    tag: ""

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /ready
      port: http

  # Resource requests and limits
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi

  http:
    host: ""
    port: 8080
    readTimeout: 60s
    writeTimeout: 60s
    idleTimeout: 120s
    shutdownTimeout: 20s
    cors:
      enabled: false
      allowedOrigins: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  # Additional environment variables
  env: []

  # Volume mounts and volumes
  volumeMounts: []
  volumes: []

  # Node selection and scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Migration
migration:
  image: 
    repository: registry.mandacode.com/mandacode-pms/migration
    pullPolicy: IfNotPresent
    tag: ""

  enabled: true
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400

  # Migration options
  allowDirty: false
  dryRun: false

  # Additional environment variables
  env: []

  # Resource requests and limits for migration job
  # Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 256Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Pod configuration
  podAnnotations: {}

  # Node selection and scheduling
  nodeSelector: {}
  affinity: {}
  tolerations: []

# Database
database:
  host: "db-host"
  port: 5432
  name: dbname
  username: dbuser
  password: "dbpassword"
  sslMode: "require"
  # existingSecret: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2
