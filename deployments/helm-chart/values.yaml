# Chart name and version
nameOverride: ""
fullnameOverride: ""

# Image 
image:
  repository: registry.mandacode.com/mandacode-pms
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
imagePullSecrets: []

# Service Account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Admin
admin:
  image: 
    repository: registry.mandacode.com/mandacode-pms/admin
    pullPolicy: IfNotPresent
    tag: ""

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  resources: {}

  http:
    host: ""
    port: 8080
    readTimeout: 60
    writeTimeout: 60
    idleTimeout: 120
    shutdownTimeout: 20
    cors:
      enabled: false
      allowedOrigins: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

# Client
client:
  image: 
    repository: registry.mandacode.com/mandacode-pms/client
    pullPolicy: IfNotPresent
    tag: ""

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080

  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  resources: {}

  http:
    host: ""
    port: 8080
    readTimeout: 60
    writeTimeout: 60
    idleTimeout: 120
    shutdownTimeout: 20
    cors:
      enabled: false
      allowedOrigins: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

# Migration
migration:
  image: 
    repository: registry.mandacode.com/mandacode-pms/migration
    pullPolicy: IfNotPresent
    tag: ""

  enabled: true
  backoffLimit: 4

  resources: {}

# Database
database:
  host: "db-host"
  port: 5432
  name: dbname
  user: dbuser
  password: "dbpassword"
  # existingSecret: ""

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
# This is to override the chart name.

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
