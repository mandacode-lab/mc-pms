# Client service default values

enabled: true

replicaCount: 1

# Inherit from parent chart
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

image:
  repository: mandacode-pms-client
  pullPolicy: IfNotPresent
  tag: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

# HTTP configuration (matches internal/config/http.go)
http:
  host: "0.0.0.0"
  port: "8080"
  readTimeout: "10s"
  writeTimeout: "10s"
  idleTimeout: "60s"
  shutdownTimeout: "5s"
  cors:
    enabled: true
    allowedOrigins:
    - "*"
    allowedMethods:
    - GET
    - OPTIONS
    allowedHeaders:
    - Origin
    - Content-Length
    - Content-Type
    - Authorization
    - Accept
    - X-Requested-With
    exposeHeaders: []
    allowCredentials: false
    maxAge: 43200

# Database configuration (matches internal/config/db.go)
database:
  enabled: true
  host: "postgres"
  port: "5432"
  username: "postgres"
  password: "postgres"
  database: "mandacode_pms"
  sslMode: "disable"

# Additional environment variables
env: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Gateway API HTTPRoute configuration
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    namespace: default
  hostnames:
  - pms.mandacode.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/client

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
