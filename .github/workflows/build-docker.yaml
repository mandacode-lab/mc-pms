name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ${{ vars.DOCKER_REGISTRY }}
  REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client, management]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # v0.1.0 -> 0.1.0
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Check if it's a stable version (no dev, alpha, beta, rc)
          if [[ "$VERSION" =~ (dev|alpha|beta|rc) ]]; then
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            echo "is_stable=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/package/Dockerfile.${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ matrix.app }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.is_stable == 'true' && format('{0}/{1}/{2}:latest', env.REGISTRY, env.REPOSITORY, matrix.app) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log out from Container Registry
        if: always()
        run: docker logout ${{ env.REGISTRY }}
