name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mandacode_ssam_test
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [5432:5432]

      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mandacode_ssam_test
          POSTGRES_SSL_MODE: disable
          REDIS_ADDR: localhost:6379
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: -exclude-dir=ent -exclude-dir=vendor ./...

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          exit-code: 0

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [client, management, migration]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build & Test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/package/Dockerfile.${{ matrix.service }}
          load: true
          tags: mandacode-ssam-${{ matrix.service }}:test
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

      - name: Verify Image
        run: |
          # Verify image was built successfully
          docker inspect mandacode-ssam-${{ matrix.service }}:test >/dev/null && echo "✅ ${{ matrix.service }} image built successfully"

          # Verify security: running as non-root user
          docker inspect mandacode-ssam-${{ matrix.service }}:test --format='{{.Config.User}}' | grep -q "1001" && echo "🔒 Security: Running as non-root user"

      - name: Analyze Image
        run: |
          echo "Analyzing Docker image: mandacode-ssam-${{ matrix.service }}:test"

          # Image size analysis
          SIZE=$(docker inspect mandacode-ssam-${{ matrix.service }}:test --format='{{.Size}}' | awk '{printf "%.2f MB", $1/1024/1024}')
          echo "Image size: $SIZE"

          # Layer analysis
          LAYERS=$(docker history mandacode-ssam-${{ matrix.service }}:test --no-trunc --format "table {{.CreatedBy}}" | wc -l)
          echo "Number of layers: $LAYERS"

          # Security analysis
          echo "Security Analysis:"
          docker inspect mandacode-ssam-${{ matrix.service }}:test --format='{{json .Config}}' | jq -r '
            "User: " + (.User // "root"),
            "WorkingDir: " + (.WorkingDir // "/"),
            "Exposed Ports: " + (if .ExposedPorts then (.ExposedPorts | keys | join(", ")) else "none" end),
            "Environment Variables: " + (.Env | length | tostring)
          '

      - name: Vulnerability Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: mandacode-ssam-${{ matrix.service }}:test
          format: "table"
          exit-code: 0
          severity: "CRITICAL,HIGH"

  helm:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint Chart
        run: helm lint deployments/chart

      - name: Template Chart
        run: helm template test deployments/chart
