name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.25"
  KEK_TEST: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mandacode_ssam_test
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [5432:5432]

      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mandacode_ssam_test
          POSTGRES_SSL_MODE: disable
          REDIS_ADDR: localhost:6379
          KEK: ${{ env.KEK_TEST }}
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: -exclude-dir=ent -exclude-dir=vendor ./...

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          exit-code: 0

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [client, management]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build & Test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/package/Dockerfile.${{ matrix.service }}
          load: true
          tags: mandacode-${{ matrix.service }}:test
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

      - name: Verify Image
        run: |
          docker run --rm mandacode-${{ matrix.service }}:test --version 2>/dev/null || echo "Image built successfully"
          docker inspect mandacode-${{ matrix.service }}:test --format='{{.Config.User}}' | grep -q "1001" && echo "Security: Running as non-root user"

  helm:
    name: Helm Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: Lint Chart
        run: helm lint deployments/chart

      - name: Template Chart
        run: helm template test deployments/chart

